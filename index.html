<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Light and dark theme (colors in css/style.css, switch in js/theme.js) -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6ee">
  <!-- Not indexed by search engines until a native speaker has checked the published levels (spec 01 D14, spec 13) -->
  <meta name="robots" content="noindex, nofollow">
  <title>Spanish Levels Map (A1–C2)</title>
  <!-- Sets the theme and the state of the left panel BEFORE the page is drawn.
       Keys must match the registry in js/profile-data.js (LM.APP.storagePrefix + id); this script runs before any JS file.
       slm.theme: "auto" (as in the system), "light" or "dark".
       slm.sidebar: { version: 1, pinned: true|false } (js/sidebar.js). -->
  <script>
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("slm.theme") || "auto"; } catch (e) {}
      var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var root = document.documentElement;
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.setAttribute("data-theme-pref", pref);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0e1526" : "#faf6ee");
      // Left panel pinned? (slm.sidebar, global for the device) — before drawing,
      // so the content does not jump at start
      var pinned = false;
      try { var sb = JSON.parse(localStorage.getItem("slm.sidebar") || "null"); pinned = !!(sb && sb.version === 1 && sb.pinned === true); } catch (e) {}
      root.setAttribute("data-sidebar", pinned ? "pinned" : "rail");
    })();
  </script>
  <!-- Self-hosted fonts (assets/fonts): preload only the critical files and only over http(s) —
       from file:// a "crossorigin" preload is blocked (console errors), and CSS loads the fonts anyway -->
  <script>
    if (/^https?:$/.test(location.protocol)) {
      ["inter-latin", "inter-latin-ext", "fraunces-latin"].forEach(function (f) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
        l.href = "assets/fonts/" + f + ".woff2";
        document.head.appendChild(l);
      });
    }
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-180.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="css/style.css?v=157">
  <link rel="stylesheet" href="css/print.css?v=157" media="print">
</head>
<body>
  <noscript>
    <p class="noscript">This page needs JavaScript turned on in your browser.</p>
  </noscript>

  <div class="app" id="app">
    <!-- LEFT PANEL (js/sidebar.js, DESIGN.md section 3.1):
         a narrow bar (72 px) that expands over the content on hover / focus / touch,
         pinned with the pin button; below 768 px a drawer opened with the "Menu" button. -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sb-panel" id="sb-panel">
        <div class="sb-head">
          <!-- Logo: a link to the home page (#/) from everywhere. The app name here and in <title> and the tagline is a fallback: js/ui.js and js/render.js set them from LM.APP (js/config.js) -->
          <a class="brand sb-brand" href="#/" aria-label="Spanish Levels Map – home" data-logo></a>
          <button type="button" class="icon-btn sb-toggle" id="sb-toggle" aria-controls="sb-panel" aria-expanded="false" aria-label="Expand sidebar"><span data-icon="panel-left-open"></span></button>
        </div>
        <p class="sb-tagline" id="sidebar-category-name">Your map of Spanish, A1–C2</p>

        <div class="sb-scroll">
          <!-- Learning tools (Trail, Today, Review, Practice, Lab, Writing) are drawn by js/render.js -->
          <nav class="sb-nav" id="tools-nav" aria-label="Learn"></nav>

          <!-- Levels A1–C2 (progress in all categories) are drawn by js/render.js -->
          <p class="sb-caption" id="sb-levels-caption">Levels · all categories</p>
          <nav class="sb-nav level-list" id="level-list" aria-labelledby="sb-levels-caption"></nav>

          <!-- Sidebar group "Exams" from the registry (js/exam-core.js); hidden while the registry is empty (spec 06 E8) -->
          <nav class="sb-nav exams-nav" id="exams-nav" aria-labelledby="sb-exams-caption" hidden></nav>
          <nav class="sb-nav exams-nav exams-soon-nav" id="exams-soon-nav" aria-label="More exams" hidden></nav>
        </div>

        <div class="sb-foot">
          <button type="button" class="sb-item sb-pin" id="sb-pin" aria-pressed="false">
            <span class="sb-icon" aria-hidden="true"><span data-icon="pin"></span></span>
            <span class="sb-label">Pin sidebar</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- RIGHT PART: the content of the current page -->
    <main class="main" id="main" tabindex="-1">
      <!-- Top bar: the menu button (phone only) and the profile menu with the "Data" section (top right corner, js/profiles.js) -->
      <div class="topbar" id="topbar">
        <button type="button" class="btn btn-secondary btn-small menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span>Menu</button>
        <div class="topbar-actions">
          <!-- Theme: Auto → Light → Dark (js/theme.js) -->
          <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Theme"></button>
          <div class="profile-slot" id="profile-slot"></div>
        </div>
      </div>
      <div class="banners" id="banners"></div>
      <div class="view" id="view"></div>
    </main>
  </div>
  <!-- Backdrop behind the open menu on a phone (a click closes the menu) -->
  <div class="nav-overlay" id="nav-overlay" hidden></div>

  <!-- Scripts load in order (no ES modules, so the app works from file://).
       ?v= is the version stamp: npm run build -- --bump raises it everywhere,
       so browsers do not use old copies from their cache. -->
  <script defer src="js/utils.js?v=157"></script>
  <!-- App and language configuration: LM.APP, LM.VERSION (js/config.js) and Spanish rules LM.lang (js/lang.js) -->
  <script defer src="js/config.js?v=157"></script>
  <script defer src="js/lang.js?v=157"></script>
  <!-- Speech (LM.speech) and the special-character bar (LM.charbar) for inputs in the target language -->
  <script defer src="js/speech.js?v=157"></script>
  <script defer src="js/charbar.js?v=157"></script>
  <!-- The syllabus (generated: npm run build) is the only list of levels, units, categories and topics; LM.syl reads it -->
  <script defer src="data/syllabus.js?v=157"></script>
  <script defer src="js/syllabus.js?v=157"></script>
  <!-- Storage key registry (LM.storage) and per-profile learning data: early, because theme.js and sidebar.js read their keys at start -->
  <script defer src="js/learning-stats.js?v=157"></script>
  <script defer src="js/profile-data.js?v=157"></script>
  <!-- Lucide icons (generated by the build) and shared visual elements -->
  <script defer src="assets/icons.js?v=157"></script>
  <script defer src="assets/lands.js?v=157"></script>
  <script defer src="assets/empty-states.js?v=157"></script>
  <script defer src="js/ui.js?v=157"></script>
  <script defer src="js/motion.js?v=157"></script>
  <!-- Pure learning logic: reviews, streak, placement test (tests: node tools/tests.js) -->
  <script defer src="js/learning.js?v=157"></script>
  <script defer src="js/theme.js?v=157"></script>
  <script defer src="js/print.js?v=157"></script>
  <script defer src="js/store.js?v=157"></script>
  <script defer src="js/dialogs.js?v=157"></script>
  <script defer src="js/render.js?v=157"></script>
  <script defer src="js/profiles.js?v=157"></script>
  <script defer src="js/markdown.js?v=157"></script>
  <!-- Highlighted sections (callouts) and tables in content -->
  <script defer src="js/callouts.js?v=157"></script>
  <script defer src="js/toc.js?v=157"></script>
  <script defer src="js/shortcuts.js?v=157"></script>
  <script defer src="js/handbook.js?v=157"></script>
  <!-- Generated data (npm run build): topic pages, summaries, cheat sheets, home; the trail generated from the syllabus -->
  <script defer src="data/pages.js?v=157"></script>
  <script defer src="data/trail.js?v=157"></script>
  <!-- Shared writing trainer engine (exams from the registry) -->
  <script defer src="js/writing-trainer.js?v=157"></script>
  <!-- Exams from the registry: the registry (small, at start), logic and module; exam content loads on demand.
       The speaking trainer (js/speaking-trainer.js, js/recorder.js) loads on entering it. -->
  <script defer src="data/exams-registry.js?v=157"></script>
  <script defer src="js/exam-logic.js?v=157"></script>
  <script defer src="js/exam-core.js?v=157"></script>
  <script defer src="js/exam-ui.js?v=157"></script>
  <!-- Flashcards: scheduler and pure logic (tests: node tools/tests.js), saved in slm.cards.<profile>; the trail logic and store -->
  <script defer src="js/cards-schedule.js?v=157"></script>
  <script defer src="js/cards-logic.js?v=157"></script>
  <script defer src="js/cards-store.js?v=157"></script>
  <script defer src="js/trail-logic.js?v=157"></script>
  <script defer src="js/trail-store.js?v=157"></script>
  <!-- Deck index (small; the decks themselves load on demand) and the flashcard views -->
  <script defer src="data/decks-index.js?v=157"></script>
  <script defer src="js/cards.js?v=157"></script>
  <script defer src="js/cards-browse.js?v=157"></script>
  <script defer src="js/words.js?v=157"></script>
  <!-- Flashcards and mistakes: one queue (review-queue.js, pure logic) and the #/review view (review.js) -->
  <script defer src="js/review-queue.js?v=157"></script>
  <script defer src="js/mistake-task.js?v=157"></script>
  <script defer src="js/review.js?v=157"></script>
  <!-- Writing: model answers with comments (data from the writing trainers, loaded on demand) -->
  <script defer src="js/writing.js?v=157"></script>
  <script defer src="js/trail.js?v=157"></script>
  <script defer src="js/mistakes.js?v=157"></script>
  <!-- Exercise engine (logic without DOM + view); exercise data loads on demand -->
  <script defer src="js/exercise-logic.js?v=157"></script>
  <script defer src="js/final-logic.js?v=157"></script>
  <script defer src="js/exercise-engine.js?v=157"></script>
  <script defer src="js/practice-hub.js?v=157"></script>
  <script defer src="js/final.js?v=157"></script>
  <!-- Tense & Mood Lab (data/lab.js loads on demand) -->
  <script defer src="js/lab-logic.js?v=157"></script>
  <script defer src="js/timeline.js?v=157"></script>
  <script defer src="js/lab.js?v=157"></script>
  <!-- Stats (attempts log, js/learning-stats.js) -->
  <script defer src="js/stats-page.js?v=157"></script>
  <!-- Search (the index loads on first opening) -->
  <script defer src="js/search-logic.js?v=157"></script>
  <script defer src="js/search.js?v=157"></script>
  <!-- My notes (a panel on content pages, #/notes) -->
  <script defer src="js/notes.js?v=157"></script>
  <script defer src="js/today.js?v=157"></script>
  <!-- Placement test (questions from content/tests/placement.json) -->
  <script defer src="js/placement.js?v=157"></script>
  <script defer src="js/data-menu.js?v=157"></script>
  <script defer src="js/sidebar.js?v=157"></script>
  <!-- Milestone celebrations (GSAP on demand) -->
  <script defer src="js/celebrate.js?v=157"></script>
  <script defer src="js/app.js?v=157"></script>
</body>
</html>
